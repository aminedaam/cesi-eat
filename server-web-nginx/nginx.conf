server {
    listen 443 ssl;
    server_name cesieat.ovh;

    #ssl_certificate /etc/ssl/cesieat.ovh/fullchain.pem;
    #ssl_certificate_key /etc/ssl/cesieat.ovh/key.pem;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    location / {
        proxy_pass http://172.16.10.12:3000;
        #proxy_pass https://cesieat.ovh:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Vary' 'Origin' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=UTF-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }
    }

    ##########################
    # BACKEND API (/users/)
    ##########################
    location /users/ {
        proxy_pass http://172.16.10.12:4000/users;
